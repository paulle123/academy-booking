<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.get('academy_name', 'Academy') }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('public.index') }}">{{ site.get('academy_name', 'Academy') }}</a>
      <nav>
        <a href="{{ url_for('public.programs') }}">Programs</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
        <a href="{{ url_for('auth.login') }}">Log in</a>
        <a href="{{ url_for('auth.enrollments') }}">Enrollments</a>
        {# Phase 2 adds: Login / Register / Dashboard links #}
      </nav>
      <form method="POST" action="{{ url_for('auth.logout') }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Log out</button>
      </form>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>{{ site.get('academy_name', '') }} &middot; {{ site.get('contact_email', '') }}</p>
      {# Phase 6 adds: Privacy Policy and Terms links #}
    </div>
  </footer>
</body>
</html>
