{% extends "base.html" %}
{% block title %}Children — {{ site.get('academy_name', '') }}{% endblock %}
{% block content %}
<h1>Children</h1>

{% for child in children %}
<article class="card">
  <h2>{{ child['name'] }}</h2>
  <p>{{ child['birth_year'] }}</p>
  <p>{{ child['utr'] }}</p>

  <a href="{{url_for('auth.edit_children', id=child['id'])}}">Edit</a>

  <form method="POST" action="{{ url_for('auth.children_delete', id=child['id']) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Delete</button>
  </form>
</article>
{% endfor %}
{% endblock %}
