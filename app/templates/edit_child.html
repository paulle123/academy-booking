{% extends "base.html" %}
{% block content %}
<h1>Edit child</h1>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{csrf_token()}}">

    <input type="text" name="name" value="{{child['name']}}">
    <input type="number" name="birth_year" value="{{child['birth_year']}}">
    <input type="number" name="utr" step="0.01" value="{{child['utr'] if child['utr'] is not none else ''}}">

    <button type="submit">Submit</button>
</form>
{% endblock %}
