{% extends "base.html" %}
{% block content %}
<h1>Log in</h1>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <input type="password" name="password">
    <input type="email" name="email">

    <button type="submit">Submit</button>
</form>
{% endblock %}
