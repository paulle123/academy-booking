# fly.toml app configuration file generated for academy-booking on 2026-07-17T21:02:46-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'academy-booking'
primary_region = 'dfw'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '10s'
  method = 'GET'
  path = '/healthz'

[mounts]
  source = 'data'
  destination = '/data'

[env]
  DATABASE_PATH = '/data/academy.db'
